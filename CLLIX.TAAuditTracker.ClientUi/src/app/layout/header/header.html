<header>
    <div class="container">
        <div class="row">
            <div class="col-md-3 col-sm-3 col-3">
                <div class="logo">
                    <img src="assets/cllixpng.png" class="logo" alt="CLLIX Logo">
                </div>
            </div>
            <div class="col-md-9 col-sm-9 col-9 text-end">
                <div class="menu-icon" (click)="openMenu()">
                    <i class="{{menu_icon}}"></i>
                </div>
                <div class="desktop_menu" [class.mobile_menu]="menuValue">
                    <ul>
                        <li (click)="closeMenu()" routerLink="/">Home</li>
                        <li (click)="closeMenu()" routerLink="/apartment">Apartment</li>
                        <li (click)="closeMenu()" routerLink="/booking-reservation">Booking Reservation</li>
                        <li (click)="closeMenu()" routerLink="/travel-agency">Travel Agency</li>
                        <li (click)="closeMenu()" routerLink="/travel-agency-agent">Agent</li>
                        <li (click)="closeMenu()" routerLink="/app-user">Users</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</header>
